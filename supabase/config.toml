[functions.feedback-report]
enabled = true
# Guests can send feedback; the function identifies signed-in callers itself.
verify_jwt = false
import_map = "./functions/feedback-report/deno.json"
entrypoint = "./functions/feedback-report/index.ts"

[functions.feedback-resolve]
enabled = true
# Accepts admin/user JWTs or the service-role key (CLI + post-commit hook); auth is checked in the function.
verify_jwt = false
import_map = "./functions/feedback-resolve/deno.json"
entrypoint = "./functions/feedback-resolve/index.ts"
